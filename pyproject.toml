[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kabena"
version = "2.1.0"
description = "K-ABENA : exclusion compensée d'échantillons par perte — même modèle, ~28% de calcul en moins (estimateur Horvitz-Thompson sans biais)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jean-Francois Bonbhel", email = "bonbhel@gmail.com" }]
keywords = ["machine-learning", "selective-backpropagation", "sample-selection", "horvitz-thompson", "sgd"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]
torch = ["torch>=2.0"]
tensorflow = ["tensorflow>=2.15"]
huggingface = ["transformers>=4.40", "datasets>=2.19"]
dev = ["pytest>=8", "scikit-learn>=1.3"]

[project.urls]
Homepage = "https://github.com/Bonbhel/kabena-ml"
Documentation = "https://github.com/Bonbhel/kabena-ml/tree/main/tutorials"
Tutorials = "https://github.com/Bonbhel/kabena-ml/tree/main/tutorials"
Reproducibility = "https://github.com/Bonbhel/kabena-ml/tree/main/validation"
Preprint = "https://github.com/Bonbhel/kabena-ml/blob/main/paper/KABENA_v3_preprint.pdf"
Changelog = "https://github.com/Bonbhel/kabena-ml/blob/main/CHANGELOG.md"
Issues = "https://github.com/Bonbhel/kabena-ml/issues"

[tool.setuptools.packages.find]
include = ["kabena*"]
